<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TECHCORE AI · 통합 엔지니어링 플랫폼</title>
  <link rel="stylesheet" href="./css/techcore.css?v=12">
</head>
<body>
<a href="#tcWork" class="tc-skip" id="tcSkip">본문으로 건너뛰기</a>
<div class="tc-app" id="tcApp">
  <aside class="tc-side" id="tcSide" aria-label="주 메뉴">
    <div class="tc-brand"><span class="tc-logo">T</span><div><strong>TECHCORE AI</strong><small>통합 엔지니어링 플랫폼</small></div></div>
    <nav id="tcNav" class="tc-nav"></nav>
  </aside>
  <div class="tc-scrim" id="tcScrim"></div>

  <div class="tc-main">
    <header class="tc-top">
      <button class="tc-icon tc-only-narrow" id="tcMenuBtn" type="button" aria-label="메뉴 열기" title="메뉴 열기"><svg class="tc-ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <button class="tc-btn" id="tcBackBtn" type="button" title="이전 화면으로 (앱 안에서 방문한 화면 기준)" disabled>← 뒤로</button>
      <button class="tc-btn" id="tcHomeBtn" type="button" title="홈으로 이동">홈</button>
      <input class="tc-search" id="tcSearch" type="search" placeholder="무엇을 하고 싶으신가요? 예: 래더 만들기" aria-label="자연어 검색" list="tcSearchList">
      <datalist id="tcSearchList"></datalist>
      <span class="tc-spacer"></span>
      <div class="tc-seg" role="group" aria-label="사용 모드">
        <button id="tcModeBeginner" type="button" title="쉬운 설명과 단계별 안내 중심">초보자</button>
        <button id="tcModeExpert" type="button" title="상세 기술 정보와 고급 설정 표시">전문가</button>
      </div>
      <button class="tc-btn" id="tcHelpBtn" type="button" title="도움말 열기">도움말</button>
      <button class="tc-btn tc-primary" id="tcAuthBtn" type="button" title="로그인 상태 확인">로그인</button>
      <button class="tc-icon" id="tcPanelBtn" type="button" aria-label="정보 패널 접기/펼치기" title="정보 패널 접기/펼치기"><svg class="tc-ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
    </header>

    <div class="tc-crumbbar">
      <nav id="tcCrumb" class="tc-crumb" aria-label="현재 위치"></nav>
      <span class="tc-spacer"></span>
      <span id="tcModeLabel" class="tc-modelabel" role="status"></span>
    </div>
    <div class="tc-body">
      <main class="tc-work" id="tcWork" tabindex="-1"></main>
      <section class="tc-work tc-framehost" id="tcFrameHost" hidden aria-label="PanelLab"></section>
      <aside class="tc-info" id="tcInfo" aria-label="정보 패널"></aside>
    </div>
  </div>
  <nav class="tc-tabs" id="tcTabs" aria-label="주요 메뉴"></nav>
<script src="./js/registry.js?v=6"></script>
<script src="./js/projects.js?v=2"></script>
<script src="./js/bridge.js?v=1"></script>
<script src="./js/analysis.js?v=1"></script>
<script src="./js/help.js?v=2"></script>
<script src="./js/ledger.js?v=1"></script>
<script src="./js/app.js?v=16"></script>
</body>
</html>
